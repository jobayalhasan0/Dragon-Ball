<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Hand Scaling Kamehameha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    #webcam { transform: scaleX(-1); position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
    #canvas-container { position: absolute; width: 100vw; height: 100vh; pointer-events: none; }
    #status-text {
      position: absolute; bottom: 30px; width: 100%; text-align: center;
      color: #00ffff; font-size: 32px; font-weight: bold;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; pointer-events: none;
    }
    #mic-btn {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; background: #00ffff; border: none; font-weight: bold;
      border-radius: 8px; cursor: pointer; z-index: 10;
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="mic-btn">CLICK TO START AUDIO & CAMERA</button>
  <video id="webcam" autoplay playsinline></video>
  <div id="canvas-container"></div>
  <div id="status-text">CLICK BUTTON TO START</div>

  <script>
    const statusText = document.getElementById('status-text');
    const micBtn = document.getElementById('mic-btn');

    // 1. Audio Setup (Microphone Volume Tracking)
    let audioContext, analyser, microphone, dataArray;
    let audioVolume = 0;

    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        analyser.fftSize = 256;
        microphone.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        console.error("Microphone access denied:", err);
      }
    }

    function getAudioVolume() {
      if (!analyser) return 0;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      return sum / dataArray.length; // Normalized volume
    }

    // 2. Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Energy Ball
    const ballGroup = new THREE.Group();
    scene.add(ballGroup);

    const coreGeo = new THREE.SphereGeometry(0.15, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    ballGroup.add(coreMesh);

    const outerGeo = new THREE.SphereGeometry(0.22, 32, 32);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0x00dfff, transparent: true, opacity: 0.7, wireframe: true });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);
    ballGroup.add(outerMesh);

    // Particles
    const particleCount = 50;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for(let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 0.5;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.04, transparent: true, opacity: 0.9 });
    const particles = new THREE.Points(particleGeo, particleMat);
    ballGroup.add(particles);

    ballGroup.visible = false;
    camera.position.z = 2;

    // Tracking Variables
    let isTracking = false;
    let handDistanceFactor = 1;

    // 3. MediaPipe Hands Setup
    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        const h1 = results.multiHandLandmarks[0][0]; // Wrist 1
        const h2 = results.multiHandLandmarks[1][0]; // Wrist 2

        // Calculate center point between 2 hands
        const avgX = (h1.x + h2.x) / 2;
        const avgY = (h1.y + h2.y) / 2;

        // Distance between hands
        const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);

        // Map position to 3D Space
        ballGroup.position.x = -(avgX - 0.5) * 3.5;
        ballGroup.position.y = -(avgY - 0.5) * 2.5;

        // Hand distance scaling factor
        handDistanceFactor = Math.max(0.5, dist * 3.5);

        ballGroup.visible = true;
        isTracking = true;
      } else {
        ballGroup.visible = false;
        isTracking = false;
      }
    });

    // Start Everything on Button Click (Browser Auto-play Policy)
    micBtn.addEventListener('click', async () => {
      await initAudio();
      micBtn.style.display = 'none';
      statusText.innerText = "MAKE SOUND OR MOVE HANDS APART!";

      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      cameraUtils.start();
    });

    // 4. Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      if (isTracking) {
        // Sound Level (0 to ~100 scale)
        const vol = getAudioVolume();
        const soundScale = 1 + (vol / 15); // Higher sound = bigger ball

        // Final Scale = (Sound Impact) * (Hand Gap Impact)
        const finalScale = soundScale * handDistanceFactor;

        ballGroup.scale.set(finalScale, finalScale, finalScale);

        // Visual effects rotation
        outerMesh.rotation.y += 0.08;
        outerMesh.rotation.z += 0.04;
        particles.rotation.y -= 0.1;

        if (vol > 20) {
          statusText.innerText = "CHARGING POWER!!!";
        } else {
          statusText.innerText = "READY";
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
