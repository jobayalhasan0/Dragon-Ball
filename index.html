<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamehameha Throw Ball AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    #webcam { transform: scaleX(-1); position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
    #canvas-container { position: absolute; width: 100vw; height: 100vh; pointer-events: none; }
    #status-text {
      position: absolute; bottom: 30px; width: 100%; text-align: center;
      color: #00ffff; font-size: 32px; font-weight: bold;
      text-shadow: 0 0 10px #00ffff; pointer-events: none;
    }
    #start-btn {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; background: #00ffff; border: none; font-weight: bold;
      border-radius: 8px; cursor: pointer; z-index: 10; font-size: 16px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="start-btn">START CAMERA & MIC</button>
  <video id="webcam" autoplay playsinline></video>
  <div id="canvas-container"></div>
  <div id="status-text">CLICK BUTTON TO START</div>

  <script>
    const statusText = document.getElementById('status-text');
    const startBtn = document.getElementById('start-btn');

    // Web Audio Setup
    let analyser, dataArray;
    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        analyser.fftSize = 256;
        microphone.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) { console.log("Audio Error"); }
    }

    function getAudioVolume() {
      if (!analyser) return 0;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      return sum / dataArray.length;
    }

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const ballGroup = new THREE.Group();
    scene.add(ballGroup);

    const coreGeo = new THREE.SphereGeometry(0.15, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    ballGroup.add(new THREE.Mesh(coreGeo, coreMat));

    const outerGeo = new THREE.SphereGeometry(0.25, 32, 32);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0x00dfff, transparent: true, opacity: 0.8, wireframe: true });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);
    ballGroup.add(outerMesh);

    ballGroup.visible = false;
    camera.position.z = 2;

    let isTracking = false;
    let isFired = false;
    let prevHandDist = 0;

    // MediaPipe Setup
    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (isFired) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        const h1 = results.multiHandLandmarks[0][0]; // Wrist 1
        const h2 = results.multiHandLandmarks[1][0]; // Wrist 2

        const avgX = (h1.x + h2.x) / 2;
        const avgY = (h1.y + h2.y) / 2;
        const currentDist = Math.hypot(h1.x - h2.x, h1.y - h2.y);

        const currentX = -(avgX - 0.5) * 3.5;
        const currentY = -(avgY - 0.5) * 2.5;

        // BLAST TRIGGER: Hat 2-ti ekbare rapid separate/khule felle
        if (prevHandDist > 0 && (currentDist - prevHandDist) > 0.18) {
          fireBall();
          return;
        }

        prevHandDist = currentDist;

        ballGroup.position.x = currentX;
        ballGroup.position.y = currentY;

        const vol = getAudioVolume();
        const scale = (1 + vol / 12) * Math.max(0.6, currentDist * 3);
        ballGroup.scale.set(scale, scale, scale);

        ballGroup.visible = true;
        isTracking = true;
        statusText.innerText = "OPEN HANDS QUICKLY TO BLAST!";
      } else {
        if (!isFired) ballGroup.visible = false;
        isTracking = false;
        prevHandDist = 0;
      }
    });

    function fireBall() {
      isFired = true;
      statusText.innerText = "KAMEHAMEHA BLAST!!!";
    }

    function resetBall() {
      isFired = false;
      ballGroup.position.set(0, 0, 0);
      ballGroup.scale.set(1, 1, 1);
      ballGroup.visible = false;
      prevHandDist = 0;
      statusText.innerText = "READY";
    }

    startBtn.addEventListener('click', async () => {
      await initAudio();
      startBtn.style.display = 'none';
      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 1280, height: 720
      });
      cameraUtils.start();
    });

    function animate() {
      requestAnimationFrame(animate);

      if (isFired) {
        // Ball forward fly & grow
        ballGroup.position.z -= 0.15;
        ballGroup.scale.multiplyScalar(1.08);

        if (ballGroup.position.z < -8 || ballGroup.scale.x > 12) {
          resetBall();
        }
      } else if (isTracking) {
        outerMesh.rotation.y += 0.1;
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
