<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamehameha Throw Ball AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }
    #webcam { transform: scaleX(-1); position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
    #canvas-container { position: absolute; width: 100vw; height: 100vh; pointer-events: none; }
    #status-text {
      position: absolute; bottom: 30px; width: 100%; text-align: center;
      color: #00ffff; font-size: 32px; font-weight: bold;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; pointer-events: none;
    }
    #mic-btn {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; background: #00ffff; border: none; font-weight: bold;
      border-radius: 8px; cursor: pointer; z-index: 10; font-size: 16px;
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="mic-btn">START CAMERA & VOICE</button>
  <video id="webcam" autoplay playsinline></video>
  <div id="canvas-container"></div>
  <div id="status-text">CLICK BUTTON TO START</div>

  <script>
    const statusText = document.getElementById('status-text');
    const micBtn = document.getElementById('mic-btn');

    // 1. Web Audio Setup
    let audioContext, analyser, microphone, dataArray;
    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        analyser.fftSize = 256;
        microphone.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) { console.log("Audio not available"); }
    }

    function getAudioVolume() {
      if (!analyser) return 0;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      return sum / dataArray.length;
    }

    // 2. Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Energy Ball Group
    const ballGroup = new THREE.Group();
    scene.add(ballGroup);

    const coreGeo = new THREE.SphereGeometry(0.15, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    ballGroup.add(coreMesh);

    const outerGeo = new THREE.SphereGeometry(0.25, 32, 32);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0x00dfff, transparent: true, opacity: 0.8, wireframe: true });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);
    ballGroup.add(outerMesh);

    ballGroup.visible = false;
    camera.position.z = 2;

    // Tracking & Throw Physics Variables
    let isTracking = false;
    let isFired = false;
    let velocityZ = 0;
    let velocityX = 0;
    let velocityY = 0;

    let prevHandPos = { x: 0, y: 0, time: Date.now() };

    // 3. MediaPipe Hands
    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (isFired) return; // If ball is already flying, skip tracking

      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        const h1 = results.multiHandLandmarks[0][0]; // Wrist
        const h2 = results.multiHandLandmarks[1][0];

        const avgX = (h1.x + h2.x) / 2;
        const avgY = (h1.y + h2.y) / 2;
        const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);

        const currentX = -(avgX - 0.5) * 3.5;
        const currentY = -(avgY - 0.5) * 2.5;

        // Calculate gesture speed (Movement velocity)
        const now = Date.now();
        const dt = (now - prevHandPos.time) / 1000;
        const speedX = (currentX - prevHandPos.x) / (dt || 0.001);
        const speedY = (currentY - prevHandPos.y) / (dt || 0.001);

        // THROW/BLAST DETECTION: Rapid push forward or rapid hand opening
        if (Math.abs(speedX) > 4.5 || Math.abs(speedY) > 4.5 || dist > 0.6) {
          fireBall(speedX, speedY);
          return;
        }

        prevHandPos = { x: currentX, y: currentY, time: now };

        ballGroup.position.x = currentX;
        ballGroup.position.y = currentY;

        // Sound scale + Hand distance scale
        const vol = getAudioVolume();
        const scale = (1 + vol / 15) * Math.max(0.6, dist * 3);
        ballGroup.scale.set(scale, scale, scale);

        ballGroup.visible = true;
        isTracking = true;
        statusText.innerText = "CHARGE POWER & PUSH HANDS TO BLAST!";
      } else {
        if (!isFired) ballGroup.visible = false;
        isTracking = false;
      }
    });

    // Fire Function (Throw Ball Effect)
    function fireBall(vx, vy) {
      isFired = true;
      velocityX = vx * 0.05;
      velocityY = vy * 0.05;
      velocityZ = -0.25; // Fly forward into 3D space
      statusText.innerText = "KAMEHAMEHA BLAST!!!";
    }

    // Reset Ball after Blast
    function resetBall() {
      isFired = false;
      ballGroup.position.set(0, 0, 0);
      ballGroup.scale.set(1, 1, 1);
      ballGroup.visible = false;
      statusText.innerText = "READY";
    }

    micBtn.addEventListener('click', async () => {
      await initAudio();
      micBtn.style.display = 'none';
      const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 1280, height: 720
      });
      cameraUtils.start();
    });

    // 4. Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      if (isFired) {
        // Fly forward & outward
        ballGroup.position.z += velocityZ;
        ballGroup.position.x += velocityX;
        ballGroup.position.y += velocityY;
        ballGroup.scale.multiplyScalar(1.05); // Grows bigger as it blasts

        // Out of view check
        if (ballGroup.position.z < -10 || ballGroup.scale.x > 15) {
          resetBall();
        }
      } else if (isTracking) {
        outerMesh.rotation.y += 0.1;
        outerMesh.rotation.z += 0.05;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
